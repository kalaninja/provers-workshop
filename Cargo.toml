[workspace]
members = ["crates/ticketing/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.metadata.creusot]
default-members = ["ticketing-creusot"]

[workspace.dependencies]
borsh = { version = "1.6.1", features = ["derive"] }
bytemuck = { version = "1.25.0", default-features = false, features = ["derive", "min_const_generics"] }
codama = "=0.9.2"
creusot-std = "=0.12.0"
mollusk-svm = "0.13.4"
num-derive = "0.4.2"
num-traits = "0.2.19"
pinocchio = "0.11.2"
pinocchio-log = "0.5.1"
pinocchio-system = "0.6.1"
proc-macro2 = "1.0.106"
quote = "1.0.45"
serde_json = "1.0.150"
solana-account = "3.4.0"
solana-account-info = "3.1.1"
solana-address = { version = "2.5.0", default-features = false }
solana-cpi = "3.1.0"
solana-instruction = "3.3.0"
solana-package-metadata = "3.0.1"
solana-program-error = "3.0.1"
solana-pubkey = "4.1.0"
solana-rent = "3.1.0"
solana-rpc-client = "4.0.0"
solana-sdk-ids = "3.1.0"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }

# Local workspace crates (paths are relative to the workspace root).
ticketing-interface = { path = "crates/ticketing/interface" }
ticketing-macros = { path = "crates/ticketing/macros" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
uninlined_format_args = "warn"
unwrap_used = "deny"

module_name_repetitions = "allow"
cast_possible_truncation = "allow"
trivially_copy_pass_by_ref = "allow"
struct_field_names = "allow"
pub_underscore_fields = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(creusot)', 'cfg(kani)', 'cfg(flux)', 'cfg(hax)'] }
