[package]
name = "ticketing-verus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `lib` first: Verus and host tests build the rlib; `cdylib` is what `cargo build-sbf` links into
# the deployable `.so`. Behavior-identical program to `ticketing-creusot` - only the spec layer
# differs.
[lib]
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[dependencies]
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-log = { workspace = true, optional = true }
pinocchio-system = { workspace = true }

ticketing-interface = { workspace = true }

# The `verus!` macro. A host-side proc-macro (never linked into the target artifact): under
# `cargo verus` (which sets `--cfg verus_keep_ghost`) it keeps the specs for verification, and in
# ordinary host/SBF builds it erases all ghost code, leaving the exec bodies as plain Rust.
verus_builtin_macros = "=0.0.0-2026-07-12-0122"

# `vstd` (Verus's stdlib) is a verification-only dependency, gated by the `verus` feature so
# ordinary host/SBF builds never pull it (it cannot link into the `no_std` SBF target). cargo-verus
# verifies with `--features verus`. Pinned to the newest crates.io `vstd`, matching the pinned
# rolling Verus release (and the `verus_builtin_macros` pin above). Its `std_specs/nonzero.rs`
# (which models `NonZeroU64` for the specs here) hides behind a feature the manifest does not
# declare, so `just verus verify` forces it on with `--cfg feature="nonzero_internals"`.
vstd = { version = "=0.0.0-2026-07-12-0122", optional = true }

[features]
default = []
# Turns on the Verus-only surface the macro cannot erase by itself: vstd and the foreign-type
# registration block (which names unstable std internals).
verus = ["dep:vstd"]
# Gates the `entrypoint!` registration so the crate can be linked as a plain rlib (host tests,
# Verus) without clashing over the program entrypoint.
bpf-entrypoint = []
# Compiles `pinocchio_log` instruction tracing into the dispatcher.
logging = ["dep:pinocchio-log"]

# Marks the crate for verification by cargo-verus (ignored by ordinary cargo builds).
[package.metadata.verus]
verify = true
