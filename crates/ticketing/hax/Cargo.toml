[package]
name = "ticketing-hax"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `lib` first: hax extracts the rlib and host tests build it; `cdylib` is what `cargo build-sbf`
# links into the deployable `.so`. The program implements the same wire protocol and decisions as
# the other lanes. The hax spec layer (inline `hax_lib` attributes + inline Lean proofs) is
# `cfg(hax)`-gated and absent from ordinary and SBF target artifacts.
[lib]
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

# Plain program dependencies. The verifier facade (`hax-lib`) rides in only under `--cfg hax`, below.
[dependencies]
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-log = { workspace = true, optional = true }
pinocchio-system = { workspace = true }

ticketing-interface = { workspace = true }

[features]
default = []
# Gates the `entrypoint!` registration so the crate can be linked as a plain rlib (host tests, hax
# extraction) without clashing over the program entrypoint.
bpf-entrypoint = []
# Compiles `pinocchio_log` instruction tracing into the dispatcher.
logging = ["dep:pinocchio-log"]

# hax sets cfg(hax) while extracting. Ordinary workspace builds therefore do not compile or carry
# the verifier facade; the executable program remains plain Rust.
[target.'cfg(hax)'.dependencies]
hax-lib = "=0.3.7"
