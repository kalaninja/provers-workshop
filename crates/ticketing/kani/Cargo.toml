[package]
name = "ticketing-kani"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `lib` first: Kani and host tests build the rlib; `cdylib` is what
# `cargo build-sbf` links into the deployable `.so`. Byte-identical program to
# `ticketing-creusot` - only the spec layer differs.
[lib]
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[dependencies]
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-log = { workspace = true, optional = true }
pinocchio-system = { workspace = true }

ticketing-interface = { workspace = true }

# No prover dependency: `cargo kani` compiles the crate with `--cfg kani` and
# injects the `kani` crate itself, so the spec layer (predicates + proof
# harnesses) is available under verification without a Cargo dependency.
# Ordinary host and SBF builds compile the same code with `#[cfg(kani)]` off.

[features]
default = []
# Gates the `entrypoint!` registration so the crate can be linked as a plain
# rlib (host tests, Kani) without clashing over the program entrypoint.
bpf-entrypoint = []
# Compiles `pinocchio_log` instruction tracing into the dispatcher.
logging = ["dep:pinocchio-log"]
