# Project descriptor for the Aeneas lane's Lean proofs (for editors and documentation). It declares
# the dependency on the Aeneas Lean base library, required by path from the aeneas-tooling image's
# baked build at /opt/aeneas/src/backends/lean.
#
# NOTE: `just aeneas verify`/`replay` do NOT drive the build through `lake`. Lake re-resolves the
# dependency graph on every run and re-clones mathlib (and its tree) from the network each time
# ("URL has changed; ... cloning again") - not hermetic. Instead scripts/aeneas/lean-check.sh
# compiles the modules with `lean` directly against the image's prebuilt oleans (see that script).
# `just aeneas verify` regenerates TicketingAeneas.lean from the crate (Charon -> Aeneas) and checks
# it; `just aeneas replay` re-checks the committed Lean.
name = "ticketing_aeneas"
defaultTargets = ["TicketingAeneas", "TicketingAeneasProofs"]

[[require]]
name = "aeneas"
path = "/opt/aeneas/src/backends/lean"

# The Aeneas-generated model of the crate (regenerated by `verify`; committed for `replay`).
[[lean_lib]]
name = "TicketingAeneas"

# The hand-written proofs over that model - the actual verification artifact.
[[lean_lib]]
name = "TicketingAeneasProofs"
